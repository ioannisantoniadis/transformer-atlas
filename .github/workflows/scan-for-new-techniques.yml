name: Scan for new architecture techniques

on:
  schedule:
    - cron: "0 9 1 * *" # 09:00 UTC on the 1st of each month
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}

            This repository (transformer-atlas) is a structured map of
            decoder-only LLM architecture techniques. Read README.md for
            the scope statement and MAP.md for the full list of what's
            already covered (both tables and the two diagrams at the top).

            Find genuinely new or newly-mainstream transformer
            architecture techniques from major AI labs (Google/DeepMind,
            OpenAI, Meta, Mistral AI, DeepSeek, NVIDIA, Anthropic, Alibaba,
            and similar) that are NOT already in MAP.md, published or
            having clearly crossed into mainstream/widely-cited adoption
            in roughly the last 35 days.

            Stay inside this repo's stated scope: decoder-only LLM
            architecture and inference-serving techniques only. Skip
            encoder-only/encoder-decoder models, vision/multimodal work,
            training/alignment methods (RLHF, DPO, etc), benchmarks, and
            minor version bumps -- README.md documents this boundary,
            follow it exactly.

            Bar for flagging something: it must be a genuinely new
            architectural technique, or an existing one that has clearly
            become mainstream/widely cited -- not routine research noise.
            If nothing meets that bar, do nothing and exit; do not open a
            placeholder or empty issue.

            Verification: a WebSearch snippet is a lead, not a citation.
            For every candidate, use WebFetch to open the actual paper
            page (arXiv abstract, HF paper page, or lab blog post) and
            confirm the title, authors/lab, and date before writing
            anything about it. Do not include a candidate whose paper
            page you couldn't independently load and confirm.

            Run `gh issue list --label candidate-technique --state all`
            first, so you don't propose the same technique twice across
            runs.

            For each qualifying candidate (cap at 5 per run), open one
            GitHub issue via `gh issue create` with:
              - Title: "New technique: <name> (<lab>, <year>)"
              - Body: what it is, why it's a candidate, links to the
                paper(s), and which MAP.md section it would likely belong
                in (Positional Encoding / Attention / MoE / Full
                Architectures / Inference Serving / etc).
              - Label: "candidate-technique" (create the label first with
                `gh label create candidate-technique --color 0e8a16 --description "Possible new addition to MAP.md" || true`
                if it doesn't already exist).

            Do not modify any files in the repository, do not commit
            anything, and do not open pull requests -- this run only
            ever writes issues.
          claude_args: |
            --allowedTools "Read,Glob,Grep,TodoWrite,WebSearch,WebFetch,Bash(gh issue list:*),Bash(gh issue create:*),Bash(gh label create:*),Bash(gh label list:*)"
            --max-turns 40

  assess:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}

            This repository (transformer-atlas) is a structured map of
            decoder-only LLM architecture techniques. Read MAP.md for
            current coverage.

            Task: grade a batch of open `candidate-technique` issues with
            an objective, evidence-based assessment -- the thing the
            maintainer reads instead of trusting either of our judgment
            calls.

            Bash rule: every command you run must be a plain literal
            string -- no command substitution (`$(...)` or backticks)
            and no shell arithmetic (`$((...))`) referencing a variable.
            Claude Code's Bash tool blocks both categorically, regardless
            of the allowlist. Do any date math or counting yourself, as
            reasoning, and only ever pass fixed literal values into
            commands.

            ## Pick this run's batch (cap: 4 issues)

            Run `gh issue list --label candidate-technique --state open --json number,title,createdAt`
            to see all open candidates. For each, check
            `gh issue view <n> --json comments --jq '.comments[].body'`
            for a comment starting with the exact line
            `### SOTA assessment` -- that's a prior assessment.

            Select up to 4 issues to assess this run, in this priority
            order: (1) issues with no SOTA-assessment comment yet -- never
            assessed, most urgent; (2) then issues whose most recent
            SOTA-assessment comment is oldest. Leave the rest for next
            run -- this keeps each run's cost bounded no matter how large
            the candidate backlog grows. Assess ONLY the selected batch.

            ## For each selected issue

            1. Paper age: determine the paper's first public date (arXiv
               submission date, or the lab's own announcement date if
               there's no preprint) via WebFetch on its paper page. This
               -- NOT when the GitHub issue was opened -- is the clock
               that matters. Get today's date with the plain literal
               command `date -u +%Y-%m-%d`, then work out the age in days
               yourself as reasoning from the two dates -- do not use
               `date -d`/arithmetic expansion to compute the difference.

            2. Citation count -- a real, independently-checkable number,
               not an estimate: run
               `curl -s "https://api.semanticscholar.org/graph/v1/paper/arXiv:<id>?fields=citationCount,influentialCitationCount"`
               with the paper's actual arXiv ID. Only use `curl` against
               this API. If the paper isn't indexed yet (common for very
               recent papers), report that explicitly rather than
               guessing a number.

            3. Adoption count: via WebSearch, count distinct labs, teams,
               or models -- other than whoever introduced the technique
               -- confirmed (with a linkable source) to use or replicate
               it.

            4. Independent discussion count: via WebSearch, count
               substantive third-party technical discussions (engineering
               blogs, other papers citing it, in-depth write-ups) -- not
               social-media mentions, and not anything published by the
               originating lab.

            5. Production status: is it shipping today in a
               generally-available model? Yes/no, with the model name
               and a source if yes.

            Compute a grade from these numbers:
              - BREAKTHROUGH: (production=yes AND citationCount >= 10)
                OR adoption_count >= 2 OR citationCount >= 30.
              - NOTABLE: production=yes OR citationCount >= 10 OR
                adoption_count >= 1.
              - EMERGING: citationCount >= 3 OR discussion_count >= 2.
              - WATCHING: none of the above (the default for a
                freshly-opened issue with no independent pickup yet).

            Post a comment on the issue -- every time it's assessed, even
            if the grade is unchanged from last time, so the assessment's
            evolution over time stays visible in the thread -- starting
            with the exact line `### SOTA assessment`, followed by: the
            paper's first-public date and age in days, citation count
            (with a link to its Semantic Scholar page, or "not yet
            indexed"), the specific adoption instances found (with
            links), the specific discussions found (with links),
            production status, and the resulting grade with a one-line
            justification.

            Then sync the issue's grade label to match, in one literal
            command that removes all four possible grade labels and adds
            back only the correct one (removing a label the issue
            doesn't have is a harmless no-op, so there's no need to check
            which one is currently set first):

              gh issue edit <n> --remove-label grade:watching --remove-label grade:emerging --remove-label grade:notable --remove-label grade:breakthrough --add-label grade:<correct-one>

            (create each label the first time it's needed, via
            `gh label create`, before referencing it).

            Backlog hygiene: if the paper is more than ~180 days old and
            the issue is still graded WATCHING or EMERGING, close it via
            `gh issue close` with a comment explaining it didn't
            accumulate enough independent evidence over that time.

            Do not modify any files in the repository, do not commit
            anything, and do not open pull requests -- this run only
            ever writes comments and labels.
          claude_args: |
            --allowedTools "Read,Glob,Grep,TodoWrite,WebSearch,WebFetch,Bash(curl:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh issue close:*),Bash(gh label create:*),Bash(gh label list:*)"
            --max-turns 60

  promote:
    needs: assess
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}

            This repository (transformer-atlas) is a structured map of
            decoder-only LLM architecture techniques. Read README.md
            (scope, structure) and MAP.md (current coverage, both tables
            and the two Mermaid diagrams at the top) before doing
            anything else.

            Bash rule: every command you run must be a plain literal
            string -- no command substitution (`$(...)` or backticks)
            and no shell arithmetic (`$((...))`) referencing a variable.
            Claude Code's Bash tool blocks both categorically, regardless
            of the allowlist. Do any date math yourself, as reasoning
            (get today's date via the plain literal `date -u +%Y-%m-%d`
            if needed), and only ever pass fixed literal values into
            commands.

            Task: promote issues the assess job that just ran has already
            graded NOTABLE or BREAKTHROUGH, by opening a PR for each.
            Nothing gets written straight to main -- every addition is a
            PR the maintainer reviews and merges. Do not re-derive the
            grade yourself -- read it from the issue's most recent
            `### SOTA assessment` comment (`gh issue view <n> --json
            comments`) and its `grade:*` label; that assessment is the
            source of truth.

            Run:
              gh issue list --label candidate-technique --label grade:notable --state open --json number,title,createdAt
              gh issue list --label candidate-technique --label grade:breakthrough --state open --json number,title,createdAt

            Eligibility:
              - BREAKTHROUGH issues are eligible immediately -- the grade
                itself represents overwhelming evidence.
              - NOTABLE issues are additionally eligible only once the
                paper's first-public date (read from the SOTA-assessment
                comment, not recomputed) is at least 21 days old.

            Take at most 2 eligible issues total. If more than 2 qualify,
            prefer BREAKTHROUGH over NOTABLE, then the older paper first.
            Leave a comment on any deferred issue noting it qualified but
            was deferred to next run.

            Before starting work on an eligible issue, run
            `gh pr list --search "<issue number> in:body" --state all`
            to make sure a previous run didn't already open a PR for it.

            For each issue you promote:

            1. `git checkout -b add-<topic-slug>` from main (branch name:
               a short kebab-case slug of the technique).
            2. `git config user.name "github-actions[bot]"` and
               `git config user.email "41898282+github-actions[bot]@users.noreply.github.com"`.
            3. Create the new topic folder following TEMPLATE.md exactly
               -- read 2-3 existing folders (e.g. flash-attention/,
               linear-attention/) as the quality/format bar:
                 - README.md: Lab/Year/Paper header line, then The
                   problem / The idea / How it's actually used /
                   Tradeoffs / References, in this repo's existing prose
                   style -- plain-language intuition, not just a
                   restatement of the abstract.
                 - implementation.py: minimal, dependency-light PyTorch,
                   written to be read. Must include a `__main__` block
                   that runs a small demo/sanity-check proving the core
                   claim (numerically, the way this repo's other 23
                   implementations do -- see linear-attention/implementation.py
                   or speculative-decoding/implementation.py for the
                   pattern). If you cannot write a correct, genuinely
                   demonstrative implementation from public information,
                   do NOT fabricate one -- abandon the promotion, comment
                   on the issue explaining what's blocking it (e.g. no
                   implementation detail public yet), and move to the
                   next candidate instead.
            4. Run `python3 <topic-folder>/implementation.py` yourself
               and confirm it exits cleanly with no traceback. If it
               errors and you can't fix it, do not open a PR -- comment
               on the issue explaining the attempt failed and needs
               manual follow-up, and move on.
            5. Update MAP.md: add a row to the correct section's table,
               AND add the technique to both Mermaid diagrams -- a node
               in the right pipeline-stage subgraph (plus its id added
               to that stage's `class ... <category>` line so it's
               colored correctly) and a node in the right year's
               subgraph in the timeline diagram.
            6. Update docs/visual-map.html: add one object to the
               `ITEMS` array in the same shape as the existing entries
               (id matching the folder name, name, lab, year, yearLabel,
               cat matching one of the existing category ids, paper URL).
            7. `git add`, `git commit` (message: what was added and
               why, referencing the issue), `git push -u origin
               add-<topic-slug>`.
            8. `gh pr create` with a body that quotes the issue's latest
               SOTA-assessment numbers (citation count, adoption/
               discussion instances, production status) as the
               justification, and ends with `Closes #<issue-number>`.

            Do not touch `main` directly at any point -- checkout,
            commit, and push only ever happen on the new branch. Do not
            rebase, force-push, or amend.
          claude_args: |
            --allowedTools "Read,Glob,Grep,TodoWrite,Edit,Write,WebSearch,WebFetch,Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue close:*),Bash(gh pr list:*),Bash(gh pr create:*),Bash(git checkout:*),Bash(git config:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git status:*),Bash(git diff:*),Bash(python3:*)"
            --max-turns 60
